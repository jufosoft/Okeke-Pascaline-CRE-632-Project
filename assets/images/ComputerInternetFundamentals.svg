<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Computer and Internet Fundamentals</title>
  <desc id="desc">An educational infographic showing a computer connected to the internet, with hardware, software, networks, and online services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .heading{font:700 42px Arial,sans-serif;fill:#172554}
      .sub{font:20px Arial,sans-serif;fill:#475569}
      .cardtitle{font:700 23px Arial,sans-serif;fill:#172554}
      .body{font:17px Arial,sans-serif;fill:#334155}
      .small{font:15px Arial,sans-serif;fill:#64748b}
      .line{stroke:#64748b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="800" rx="28" fill="url(#bg)"/>
  <text x="600" y="76" text-anchor="middle" class="heading">COMPUTER &amp; INTERNET FUNDAMENTALS</text>
  <text x="600" y="112" text-anchor="middle" class="sub">Understanding the tools, programs and networks that connect us</text>

  <!-- central computer -->
  <rect x="385" y="205" width="430" height="275" rx="20" fill="#1e293b"/>
  <rect x="405" y="225" width="390" height="230" rx="10" fill="url(#screen)"/>
  <circle cx="600" cy="465" r="5" fill="#94a3b8"/>
  <path d="M550 480 L535 515 H665 L650 480" fill="#64748b"/>
  <rect x="500" y="515" width="200" height="15" rx="7" fill="#475569"/>
  <rect x="465" y="540" width="270" height="16" rx="8" fill="#94a3b8"/>
  <text x="600" y="295" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="white">COMPUTER</text>
  <g fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="545" y="325" width="110" height="72" rx="8"/>
    <path d="M565 410 H635 M600 397 V410"/>
    <path d="M565 345 H635 M565 360 H615 M565 375 H625"/>
  </g>

  <!-- connection lines -->
  <path d="M385 330 H300 V255" class="line"/>
  <path d="M815 330 H900 V255" class="line"/>
  <path d="M385 425 H300 V590" class="line"/>
  <path d="M815 425 H900 V590" class="line"/>
  <circle cx="300" cy="330" r="7" fill="#64748b"/><circle cx="900" cy="330" r="7" fill="#64748b"/>
  <circle cx="300" cy="425" r="7" fill="#64748b"/><circle cx="900" cy="425" r="7" fill="#64748b"/>

  <!-- hardware card -->
  <rect x="65" y="165" width="235" height="180" rx="18" fill="white" stroke="#bfdbfe" stroke-width="2"/>
  <g transform="translate(155 190)" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="55" height="40" rx="5"/><path d="M27 40 V50 M12 50 H43"/>
  </g>
  <text x="182" y="270" text-anchor="middle" class="cardtitle">HARDWARE</text>
  <text x="182" y="300" text-anchor="middle" class="body">Physical parts</text>
  <text x="182" y="324" text-anchor="middle" class="small">Keyboard • Monitor • CPU</text>

  <!-- software card -->
  <rect x="900" y="165" width="235" height="180" rx="18" fill="white" stroke="#ddd6fe" stroke-width="2"/>
  <g transform="translate(990 188)" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="55" height="48" rx="6"/><path d="M13 15 L22 24 L13 33 M29 33 H43"/>
  </g>
  <text x="1017" y="270" text-anchor="middle" class="cardtitle">SOFTWARE</text>
  <text x="1017" y="300" text-anchor="middle" class="body">Programs &amp; apps</text>
  <text x="1017" y="324" text-anchor="middle" class="small">Operating system • Browser</text>

  <!-- network card -->
  <rect x="65" y="590" width="235" height="150" rx="18" fill="white" stroke="#a7f3d0" stroke-width="2"/>
  <g transform="translate(155 610)" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round">
    <circle cx="27" cy="8" r="6"/><circle cx="3" cy="45" r="6"/><circle cx="51" cy="45" r="6"/>
    <path d="M24 14 L7 39 M30 14 L47 39 M9 45 H45"/>
  </g>
  <text x="182" y="690" text-anchor="middle" class="cardtitle">NETWORKS</text>
  <text x="182" y="718" text-anchor="middle" class="small">Devices sharing information</text>

  <!-- internet card -->
  <rect x="900" y="590" width="235" height="150" rx="18" fill="white" stroke="#fed7aa" stroke-width="2"/>
  <g transform="translate(990 605)" fill="none" stroke="#ea580c" stroke-width="4">
    <circle cx="27" cy="27" r="25"/><ellipse cx="27" cy="27" rx="11" ry="25"/>
    <path d="M3 27 H51 M8 14 H46 M8 40 H46"/>
  </g>
  <text x="1017" y="690" text-anchor="middle" class="cardtitle">THE INTERNET</text>
  <text x="1017" y="718" text-anchor="middle" class="small">A worldwide network</text>

  <rect x="365" y="620" width="470" height="95" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="600" y="657" text-anchor="middle" class="cardtitle">WHAT IT HELPS US DO</text>
  <text x="600" y="690" text-anchor="middle" class="body">Learn • Communicate • Create • Share information</text>
</svg>